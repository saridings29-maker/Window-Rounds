<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Window-Rounds</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1976d2">
  <style>
    body { font-family: Arial, sans-serif; background:#f5f5f5; margin:0; padding:12px; }
    h1 { font-size:28px; margin:10px 0 12px; }

    .card { background:#fff; padding:12px; border-radius:10px; margin:10px 0; }
    .muted { color:#666; font-size:14px; }

    select, input, textarea, button {
      width:100%; padding:12px; margin:8px 0; border-radius:8px;
      border:1px solid #ddd; box-sizing:border-box; font-size:16px;
      background:#fff;
    }
    textarea { min-height:70px; }
    button { background:#1976d2; color:#fff; border:none; font-weight:700; }

    .grid {
      display:grid;
      grid-template-columns: 1fr 160px 140px 120px;
      gap:10px;
    }
    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }

    .tableWrap { overflow:auto; border-radius:10px; }
    table { width:100%; border-collapse:collapse; min-width:780px; background:#fff; }
    th, td { padding:10px; border-bottom:1px solid #eee; text-align:left; vertical-align:top; }
    th { position:sticky; top:0; background:#fafafa; z-index:1; font-size:13px; color:#444; }
    td small { color:#666; }
    .pill { display:inline-block; padding:3px 10px; border-radius:999px; background:#eef3ff; color:#1a3f9b; font-size:12px; }
    .paid { font-weight:700; }
    .paidYes { color:#1b7f3a; }
    .paidNo { color:#b42318; }
    .actions button { width:auto; padding:8px 10px; margin:0; border-radius:8px; font-size:14px; }
    .btnGhost { background:#e9eefc; color:#123; }
    .btnDanger { background:#b42318; }

    .row { display:flex; gap:10px; flex-wrap:wrap; }
    .row > div { flex:1; min-width:220px; }
  </style>
</head>

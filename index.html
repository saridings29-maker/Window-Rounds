<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Window-Rounds</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1976d2">
  <style>
    body { font-family: Arial, sans-serif; background:#f5f5f5; margin:0; padding:12px; }
    h1 { font-size:28px; margin:10px 0 12px; }

    .card { background:#fff; padding:12px; border-radius:10px; margin:10px 0; }
    .muted { color:#666; font-size:14px; }

    select, input, textarea, button {
      width:100%; padding:12px; margin:8px 0; border-radius:8px;
      border:1px solid #ddd; box-sizing:border-box; font-size:16px;
      background:#fff;
    }
    textarea { min-height:70px; }
    button { background:#1976d2; color:#fff; border:none; font-weight:700; }

    .grid {
      display:grid;
      grid-template-columns: 1fr 160px 140px 120px;
      gap:10px;
    }
    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }

    .tableWrap { overflow:auto; border-radius:10px; }
    table { width:100%; border-collapse:collapse; min-width:780px; background:#fff; }
    th, td { padding:10px; border-bottom:1px solid #eee; text-align:left; vertical-align:top; }
    th { position:sticky; top:0; background:#fafafa; z-index:1; font-size:13px; color:#444; }
    td small { color:#666; }
    .pill { display:inline-block; padding:3px 10px; border-radius:999px; background:#eef3ff; color:#1a3f9b; font-size:12px; }
    .paid { font-weight:700; }
    .paidYes { color:#1b7f3a; }
    .paidNo { color:#b42318; }
    .actions button { width:auto; padding:8px 10px; margin:0; border-radius:8px; font-size:14px; }
    .btnGhost { background:#e9eefc; color:#123; }
    .btnDanger { background:#b42318; }

    .row { display:flex; gap:10px; flex-wrap:wrap; }
    .row > div { flex:1; min-width:220px; }
  </style>
</head>
<body>
  <h1>Window-Rounds</h1>

  <div class="card">
    <div class="muted">Select round</div>
    <select id="round"></select>

    <div class="muted">Add customer</div>

    <div class="grid">
      <div>
        <label class="muted">Customer name</label>
        <input id="name" placeholder="Customer name" />
      </div>

      <div>
        <label class="muted">Date</label>
        <input id="date" type="date" />
      </div>

      <div>
        <label class="muted">Price (£)</label>
        <input id="price" type="number" step="0.01" inputmode="decimal" placeholder="e.g. 12.50" />
      </div>

      <div>
        <label class="muted">Paid</label>
        <select id="paid">
          <option value="no">No</option>
          <option value="yes">Yes</option>
        </select>
      </div>
    </div>

    <label class="muted">Notes</label>
    <textarea id="notes" placeholder="Notes (gate code, dog, access etc.)"></textarea>

    <button id="saveBtn">Save customer</button>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <div class="muted">Search</div>
        <input id="search" placeholder="Search name / notes…" />
      </div>
      <div>
        <div class="muted">Filter by round</div>
        <select id="filter">
          <option value="__ALL__">All rounds</option>
        </select>
      </div>
      <div>
        <div class="muted">Show</div>
        <select id="showPaid">
          <option value="__ALL__">All</option>
          <option value="no">Unpaid only</option>
          <option value="yes">Paid only</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card tableWrap">
    <table>
      <thead>
        <tr>
          <th>Customer</th>
          <th>Round</th>
          <th>Date</th>
          <th>Price</th>
          <th>Paid</th>
          <th>Notes</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <script>
    // PWA SW
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    const rounds = [
      "Bredbury","Cheadle","Wythenshawe","Carling","Haslington","Sale",
      "Timperley 1","Timperley 2","Dunisher","Day in sale","Day in sale","Man of leisure"
    ];

    const $ = (id) => document.getElementById(id);

    // Populate round selects
    rounds.forEach(r => {
      const opt1 = document.createElement("option");
      opt1.value = r; opt1.textContent = r;
      $("round").appendChild(opt1);

      const opt2 = document.createElement("option");
      opt2.value = r; opt2.textContent = r;
      $("filter").appendChild(opt2);
    });

    // Load existing data (backwards-compatible)
    let data = JSON.parse(localStorage.getItem("customers") || "[]");

    function saveData() {
      localStorage.setItem("customers", JSON.stringify(data));
    }

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[m]));
    }

    function formatDate(d) {
      if (!d) return "";
      // Expecting YYYY-MM-DD
      return d;
    }

    function formatMoney(n) {
      if (n === "" || n === null || n === undefined) return "";
      const num = Number(n);
      if (Number.isNaN(num)) return "";
      return "£" + num.toFixed(2);
    }

    function addCustomer() {
      const round = $("round").value;
      const name = $("name").value.trim();
      const date = $("date").value; // YYYY-MM-DD
      const price = $("price").value;
      const paid = $("paid").value; // yes/no
      const notes = $("notes").value.trim();

      if (!name) { alert("Please enter a customer name"); return; }

      data.push({
        id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()),
        round,
        name,
        date: date || "",
        price: price === "" ? "" : Number(price),
        paid: paid || "no",
        notes: notes || "",
        createdAt: Date.now()
      });

      saveData();
      $("name").value = "";
      $("date").value = "";
      $("price").value = "";
      $("paid").value = "no";
      $("notes").value = "";
      render();
    }

    function togglePaid(id) {
      const i = data.findIndex(x => x.id === id);
      if (i === -1) return;
      data[i].paid = (data[i].paid === "yes") ? "no" : "yes";
      saveData();
      render();
    }

    function removeCustomer(id) {
      if (!confirm("Delete this customer?")) return;
      data = data.filter(x => x.id !== id);
      saveData();
      render();
    }

    function render() {
      const q = $("search").value.trim().toLowerCase();
      const f = $("filter").value;
      const paidFilter = $("showPaid").value;

      // map old records safely (if you created customers before these fields existed)
      const safe = data.map(d => ({
        ...d,
        date: d.date || "",
        price: (d.price === undefined ? "" : d.price),
        paid: d.paid || "no",
        notes: d.notes || ""
      }));

      const filtered = safe
        .filter(d => (f === "__ALL__" ? true : d.round === f))
        .filter(d => (paidFilter === "__ALL__" ? true : d.paid === paidFilter))
        .filter(d => {
          if (!q) return true;
          return (d.name || "").toLowerCase().includes(q) || (d.notes || "").toLowerCase().includes(q);
        })
        .sort((a,b) => (b.createdAt||0) - (a.createdAt||0));

      $("tbody").innerHTML = filtered.map(d => {
        const paidText = d.paid === "yes" ? "Paid" : "Unpaid";
        const paidClass = d.paid === "yes" ? "paidYes" : "paidNo";
        return `
          <tr>
            <td><b>${escapeHtml(d.name)}</b></td>
            <td><span class="pill">${escapeHtml(d.round)}</span></td>
            <td>${escapeHtml(formatDate(d.date))}</td>
            <td>${escapeHtml(formatMoney(d.price))}</td>
            <td class="paid ${paidClass}">${paidText}</td>
            <td><small>${escapeHtml(d.notes)}</small></td>
            <td class="actions">
              <button class="btnGhost" onclick="togglePaid('${d.id}')">Toggle paid</button>
              <button class="btnDanger" onclick="removeCustomer('${d.id}')">Delete</button>
            </td>
          </tr>
        `;
      }).join("") || `<tr><td colspan="7" class="muted">No customers yet. Add your first one above.</td></tr>`;
    }

    $("saveBtn").addEventListener("click", addCustomer);
    $("search").addEventListener("input", render);
    $("filter").addEventListener("change", render);
    $("showPaid").addEventListener("change", render);

    // expose functions for buttons
    window.togglePaid = togglePaid;
    window.removeCustomer = removeCustomer;

    render();
  </script>
</body>
</html>

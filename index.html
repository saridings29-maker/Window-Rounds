<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Window-Rounds</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1976d2">
  <style>
    body { font-family: Arial, sans-serif; background:#f5f5f5; margin:0; padding:12px; }
    h1 { font-size:28px; margin:10px 0 12px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; }
    select, input, textarea, button {
      width:100%; padding:12px; margin:8px 0; border-radius:8px;
      border:1px solid #ddd; box-sizing:border-box; font-size:16px;
      background:#fff;
    }
    textarea { min-height:80px; }
    button { background:#1976d2; color:#fff; border:none; font-weight:700; }
    .card { background:#fff; padding:12px; border-radius:10px; margin:10px 0; }
    .muted { color:#666; font-size:14px; }
    .pill { display:inline-block; padding:4px 10px; border-radius:999px; background:#eef3ff; color:#1a3f9b; font-size:12px; margin-top:6px;}
  </style>
</head>
<body>
  <h1>Window-Rounds</h1>

  <div class="card">
    <div class="muted">Select round</div>
    <select id="round">
      <option>Bredbury</option>
      <option>Cheadle</option>
      <option>Wythenshawe</option>
      <option>Carling</option>
      <option>Haslington</option>
      <option>Sale</option>
      <option>Timperley 1</option>
      <option>Timperley 2</option>
      <option>Dunisher</option>
      <option>Day in sale</option>
      <option>Day in sale</option>
      <option>Man of leisure</option>
    </select>

    <div class="muted">Add / edit customer</div>
    <input id="name" placeholder="Customer name" />
    <textarea id="notes" placeholder="Notes (e.g. gate code, dog, payment notes)"></textarea>
    <button id="saveBtn">Save customer</button>
  </div>

  <div class="card">
    <div class="row">
      <div style="flex:1; min-width:220px;">
        <div class="muted">Search</div>
        <input id="search" placeholder="Search name / notes…" />
      </div>
      <div style="flex:1; min-width:220px;">
        <div class="muted">Filter</div>
        <select id="filter">
          <option value="__ALL__">All rounds</option>
        </select>
      </div>
    </div>
  </div>

  <div id="list"></div>

  <script>
    // PWA SW
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    const rounds = [
      "Bredbury","Cheadle","Wythenshawe","Carling","Haslington","Sale",
      "Timperley 1","Timperley 2","Dunisher","Day in sale","Day in sale","Man of leisure"
    ];

    const $ = (id) => document.getElementById(id);

    // populate filter
    rounds.forEach(r => {
      const opt = document.createElement("option");
      opt.value = r;
      opt.textContent = r;
      $("filter").appendChild(opt);
    });

    let data = JSON.parse(localStorage.getItem("customers") || "[]");

    function save() {
      const r = $("round").value;
      const n = $("name").value.trim();
      const notes = $("notes").value.trim();
      if (!n) { alert("Please enter a customer name"); return; }

      data.push({ id: crypto.randomUUID(), round: r, name: n, notes, createdAt: Date.now() });
      localStorage.setItem("customers", JSON.stringify(data));
      $("name").value = "";
      $("notes").value = "";
      render();
    }

    function render() {
      const q = $("search").value.trim().toLowerCase();
      const f = $("filter").value;

      const filtered = data
        .filter(d => (f === "__ALL__" ? true : d.round === f))
        .filter(d => {
          if (!q) return true;
          return (d.name || "").toLowerCase().includes(q) || (d.notes || "").toLowerCase().includes(q);
        })
        .sort((a,b) => (b.createdAt||0) - (a.createdAt||0));

      $("list").innerHTML = filtered.map(d => `
        <div class="card">
          <div style="font-weight:800; font-size:18px;">${escapeHtml(d.name)}</div>
          <div class="pill">${escapeHtml(d.round)}</div>
          <div style="margin-top:8px; white-space:pre-wrap;">${escapeHtml(d.notes || "")}</div>
        </div>
      `).join("") || `<div class="card muted">No customers yet. Add your first one above.</div>`;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[m]));
    }

    $("saveBtn").addEventListener("click", save);
    $("search").addEventListener("input", render);
    $("filter").addEventListener("change", render);

    render();
  </script>
</body>
</html>
